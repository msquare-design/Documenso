# M Square: builds our Documenso image (Arabic + M Square changes) on every push to msquare/arabic and pushes it to
# GitHub Container Registry:
#
#   ghcr.io/msquare-design/documenso:<upstream version>-ar-<commit>   e.g. v2.21.1-ar-1a2b3c4  (pin this on the server)
#   ghcr.io/msquare-design/documenso:<upstream version>-ar            latest build for that version
#
# To move onto a new Documenso release, run msquare/update.sh <version> locally and push (see msquare/README.md).
name: M Square image

on:
  push:
    branches: ['msquare/arabic']
    paths-ignore: ['msquare/**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: msquare-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "upstream=$(cat msquare/UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/msquare-design/documenso:${{ steps.v.outputs.upstream }}-ar-${{ steps.v.outputs.short }}
            ghcr.io/msquare-design/documenso:${{ steps.v.outputs.upstream }}-ar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.upstream }}-ar
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo "\`ghcr.io/msquare-design/documenso:${{ steps.v.outputs.upstream }}-ar-${{ steps.v.outputs.short }}\`"
            echo
            echo "On the server: put it as \`image:\` in /opt/documenso/docker-compose.yml, then \`docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
